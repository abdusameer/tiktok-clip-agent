[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipagent"
version = "0.1.0"
description = "Local TikTok clip agent for authorized videos"
requires-python = ">=3.11"
dependencies = ["typer", "faster-whisper"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
clipagent = "clipagent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
